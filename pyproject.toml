[project]
name = "pdfbud"
dynamic = ["version"]
description = "A small Mac app to black out and edit text in PDFs"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pymupdf",
    "pywebview",
    "rapidfuzz",
    "pyobjc-framework-Vision; sys_platform == 'darwin'",
]

[project.scripts]
pdfbud = "pdfbud.app:main"

[dependency-groups]
dev = ["pytest", "pyinstaller", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pdfbud/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfbud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
src = ["src", "tests"]
extend-exclude = ["tests/ui"]  # dense by-hand scripts that drive a real window

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
