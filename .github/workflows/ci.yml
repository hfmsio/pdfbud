name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run pytest
      - run: ./packaging/build.sh
      - name: Check the packaged app can read text from a picture
        run: dist/pdfbud.app/Contents/MacOS/pdfbud --check
      - run: ditto -c -k --keepParent dist/pdfbud.app pdfbud-app.zip
      - uses: actions/upload-artifact@v7
        with:
          name: pdfbud-app
          path: pdfbud-app.zip
