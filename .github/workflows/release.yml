name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --group dev
      - name: The tag must match the version in the code
        run: |
          VERSION=$(uv run python -c 'import pdfbud; print(pdfbud.__version__)')
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; }
      - run: uv run pytest
      - run: ./packaging/build.sh
      - name: Check the packaged app can read text from a picture
        run: dist/pdfbud.app/Contents/MacOS/pdfbud --check
      - run: ./packaging/dmg.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256 --generate-notes --verify-tag
